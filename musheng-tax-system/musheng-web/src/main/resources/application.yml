# ============================================
# Musheng Tax System Configuration
# ============================================

server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: musheng-tax-system

  # Database Configuration
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/musheng_tax?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: ${DB_PASSWORD:root}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1200000

  # Redis Configuration (仅当 sa-token.cache.type=redis 时需要配置)
  # 当使用 Caffeine 本地缓存时，以下配置不会生效，可以不配置
#  data:
#    redis:
#      host: ${REDIS_HOST:localhost}
#      port: ${REDIS_PORT:6379}
#      password: ${REDIS_PASSWORD:}
#      database: 0
#      lettuce:
#        pool:
#          max-active: 20
#          max-idle: 10
#          min-idle: 5
#          max-wait: -1ms

  # File Upload Configuration
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
      enabled: true

  # Jackson Configuration
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

# MyBatis-Plus Configuration
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.musheng.**.entity
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      table-prefix: t_
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# Sa-Token Configuration
sa-token:
  token-name: Authorization
  token-prefix: Bearer
  is-read-header: true
  is-read-cookie: false
  timeout: 86400
  active-timeout: -1
  is-concurrent: true
  is-share: true
  token-style: uuid
  is-log: true
  # 缓存配置
  cache:
    # 缓存类型: caffeine (本地缓存，默认) 或 redis (分布式缓存)
    # caffeine: 适合单机部署的内部系统，无需外部依赖，服务重启后登录状态丢失
    # redis: 适合集群部署，需要配置 Redis 连接信息，支持会话共享
    type: caffeine

# Knife4j API Documentation Configuration
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

knife4j:
  enable: true
  setting:
    language: zh_cn

# Application Custom Configuration
app:
  # File Upload Path
  upload:
    chunk-dir: ./uploads/chunks
    final-dir: ./uploads/files
    temp-dir: ./uploads/temp

  # Company Information
  company:
    name-en: dongguanshimushengshangmaoyouxiangongsi
    tax-id: 91441900MA4WNG4C6H

  # Business Configuration
  business:
    purchase-ratio: 0.96
    rate-defer-max-days: 10

  # 单据交易方信息配置（INV/结算单中的卖方/买方信息）
  document:
    party:
      seller-name: "Hong Kong Andeo Group Limited"
      seller-address: "ROOM 1201, 12/F TAI SANG BANK BUILDING 130-132 DES VOEUX ROAD, CENTRAL HONGKONG"
      seller-phone: "00852-54682464"
      buyer-name: "Dongguan Musheng Trade Co., Ltd."
      buyer-address: "Room 606, Building 2, Humen Wanda Plaza, No. 82 Liansheng Road, Humen Town, Dongguan, Guangdong, China"
      buyer-phone: "18575382420"
      bank-account-name: "Hong Kong Andeo Group Limited"
      bank-account-number: "012-878-0-001234-5"
      bank-name: "Bank of China (Hong Kong) Limited"
      bank-address: "Bank of China Tower, 1 Garden Road, Central, Hong Kong"
      swift-code: "BKCHHKHH"

  # Import Configuration
  import:
    # 自动创建站点（当导入数据中的 siteCode 不存在时）
    auto-create-marketplace: false
    # 自动创建货币（当导入数据中的 currencyCode 不存在时）
    auto-create-currency: false

# Logging Configuration
logging:
  level:
    root: info
    com.musheng: debug
    org.springframework: info
    com.baomidou.mybatisplus: debug
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
